[platformio]
default_envs = manual

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter

lib_deps =
    ftservo/FTServo@^2.0.0

upload_port = COM7
monitor_port = COM7

[env:manual]
build_src_filter = -<*> +<manual.cpp>

[env:config]
build_src_filter = -<*> +<config.cpp>

[env:set-id]
build_src_filter = -<*> +<set-id.cpp>
